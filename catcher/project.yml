name: CatcherApp
options:
  bundleIdPrefix: com.catcher
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
packages:
  Catcher:
    path: .
targets:
  CatcherApp:
    type: application
    platform: macOS
    sources:
      - path: Sources/CatcherApp
        excludes:
          - Info.plist
    dependencies:
      - package: Catcher
        product: Pipeline
      - package: Catcher
        product: Verifier
      - package: Catcher
        product: SessionStore
      - package: Catcher
        product: AudioCapture
      - package: Catcher
        product: TranscriptionEngine
      - package: Catcher
        product: GrokEngine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.catcher.app
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Sources/CatcherApp/Info.plist
        MARKETING_VERSION: "0.0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
